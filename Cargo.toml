[package]
name = "anna-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.7", features = ["ws"] }
anyhow = "1.0.98"
async-trait = "0.1.88"
async-recursion = "1.1.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.32", features = ["derive"] }
cron = "0.15.0"
glob = "0.3.3"
humantime = "2.2.0"
rand = "0.9.0"
reqwest = { version = "0.12.13", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shell-words = "1.1.0"
tokio = { version = "1.44.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
